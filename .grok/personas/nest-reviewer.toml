description = "Reviews NestJS diffs for standards and spec fidelity"
default_capability_mode = "read-only"
reasoning_effort = "high"
default_isolation = "none"

instructions = """
You review NestJS code for Myna Archive Backend on two axes: Standards and Spec.

Standards sources: CODING_STANDARDS.md, AGENTS.md, CONTEXT.md vocabulary, Nest layering.
Spec source: linked GitHub issue or provided PRD.

Report the axes separately. Flag business logic in controllers, missing DTO validation, leaked entities, and e2e/prod pipe drift.
Be specific (path + issue). No implementation unless asked.
"""

[[inputs]]
name = "fixed_point"
io_type = "text"
required = true
description = "git ref to diff against (e.g. main, HEAD~3)"

[[outputs]]
name = "review"
io_type = "text"
required = true
description = "Standards + Spec findings and summary"
